<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title description">
  <title id="title">WireLint, static analysis for LabVIEW</title>
  <desc id="description">A stylized LabVIEW block diagram with colored wires flowing through an analysis lens into a clean check mark.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101A32"/>
      <stop offset="1" stop-color="#17294A"/>
    </linearGradient>
    <linearGradient id="accent" x1="95" y1="145" x2="560" y2="335" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54E0C1"/>
      <stop offset="1" stop-color="#77A9FF"/>
    </linearGradient>
    <linearGradient id="lens" x1="792" y1="118" x2="1009" y2="335" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263D65"/>
      <stop offset="1" stop-color="#1A2A49"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#A8C4F0" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="730" y="46" width="374" height="374" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#background)"/>
  <rect width="1200" height="400" rx="28" fill="url(#grid)"/>
  <path d="M0 338C212 274 356 421 572 356s402-125 628-42v86H0z" fill="#21375C" fill-opacity=".36"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="72" y="73" width="282" height="30" rx="15" fill="#55DABD" fill-opacity=".12" stroke="#55DABD" stroke-opacity=".3"/>
    <circle cx="91" cy="88" r="4" fill="#55DABD"/>
    <text x="104" y="93" fill="#8DE9D5" font-size="12" font-weight="700" letter-spacing="1.7">STATIC ANALYSIS FOR LABVIEW</text>
    <text x="70" y="175" fill="#F4F7FF" font-size="66" font-weight="750" letter-spacing="-2.5">Wire<tspan fill="url(#accent)">Lint</tspan></text>
    <text x="74" y="216" fill="#C5D1E6" font-size="20" font-weight="450">Find diagram issues before they ship.</text>
    <path d="M74 263H114" stroke="#55DABD" stroke-width="3" stroke-linecap="round"/>
    <text x="74" y="292" fill="#8FA2C2" font-size="14">Fast, independent checks for LabVIEW files.</text>
  </g>

  <g opacity=".78" stroke-linecap="round" stroke-linejoin="round">
    <path d="M557 116H677V173H760" stroke="#F5B85C" stroke-width="5"/>
    <path d="M557 194H726V210H810" stroke="#62DDBF" stroke-width="5"/>
    <path d="M557 271H690V246H780" stroke="#8EAFFF" stroke-width="5"/>
    <path d="M554 117H626V140H770" stroke="#D18CFF" stroke-width="2" stroke-dasharray="4 9" opacity=".8"/>
    <circle cx="677" cy="116" r="5" fill="#F5B85C"/>
    <circle cx="726" cy="194" r="5" fill="#62DDBF"/>
    <circle cx="690" cy="271" r="5" fill="#8EAFFF"/>
  </g>

  <g>
    <rect x="486" y="91" width="72" height="218" rx="12" fill="#223759" stroke="#6882A9" stroke-opacity=".65"/>
    <rect x="486.75" y="91.75" width="70.5" height="34" rx="11" fill="#314B73"/>
    <path d="M487 115h70" stroke="#6882A9" stroke-opacity=".5"/>
    <text x="522" y="112" text-anchor="middle" fill="#DCE8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">VI</text>
    <circle cx="501" cy="147" r="3" fill="#F5B85C"/>
    <circle cx="501" cy="194" r="3" fill="#62DDBF"/>
    <circle cx="501" cy="241" r="3" fill="#8EAFFF"/>
    <circle cx="543" cy="173" r="3" fill="#F5B85C"/>
    <circle cx="543" cy="210" r="3" fill="#62DDBF"/>
    <circle cx="543" cy="246" r="3" fill="#8EAFFF"/>
    <rect x="508" y="158" width="29" height="61" rx="6" fill="#182842" stroke="#527096"/>
    <path d="M514 173h17M514 188h12M514 203h17" stroke="#91A9CC" stroke-width="2" stroke-linecap="round"/>
    <path d="M512 265h20" stroke="#6681A7" stroke-width="2" stroke-linecap="round"/>
    <circle cx="522" cy="282" r="3" fill="#55DABD"/>
  </g>

  <circle cx="894" cy="206" r="112" fill="#55DABD" fill-opacity=".13" filter="url(#glow)"/>
  <g>
    <circle cx="894" cy="195" r="95" fill="url(#lens)" stroke="#82B7FF" stroke-opacity=".45" stroke-width="2"/>
    <circle cx="894" cy="195" r="82" stroke="#8CA8D0" stroke-opacity=".18"/>
    <path d="M960 263l62 62" stroke="#82B7FF" stroke-opacity=".45" stroke-width="24" stroke-linecap="round"/>
    <path d="M960 263l62 62" stroke="#A7C9FF" stroke-width="12" stroke-linecap="round"/>
    <path d="m850 195 29 29 60-66" stroke="#68E2BE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="894" cy="195" r="54" stroke="#68E2BE" stroke-opacity=".17" stroke-width="2"/>
    <circle cx="835" cy="113" r="4" fill="#F5B85C"/>
    <circle cx="963" cy="136" r="3" fill="#D18CFF"/>
    <circle cx="824" cy="246" r="3" fill="#62DDBF"/>
  </g>
</svg>
