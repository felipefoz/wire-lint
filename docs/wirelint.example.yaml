# Copy this file and pass your copy with --config.
# Keep every built-in rule listed here with its default options.
version: 1

# Fail for error findings. Use warning to also fail for warning findings,
# or none to report findings without failing. Analysis errors always fail.
fail-on: error

rules:
  # Require separate compiled code from source for VI-family files and
  # the equivalent new-item setting on projects, libraries, and classes.
  separate-compiled-code:
    enabled: true
    severity: warning
